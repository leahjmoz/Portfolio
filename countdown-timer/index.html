<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Countdown Timer</title>
<style>
  :root {
    --bg: #171a2e;
    --panel: #21254a;
    --fill: #ff6f5e;
    --accent: #ffd166;
    --text: #f4f2ff;
    --muted: #8b8fc2;
    --good: #4fd1a5;
    --bad: #ff6f5e;
    --overtime: #e8283e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100vh;
    height: 100dvh;
    background: radial-gradient(circle at 50% -10%, #262a52 0%, var(--bg) 60%);
    color: var(--text);
    font-family: 'Segoe UI Rounded', 'SF Pro Rounded', 'Trebuchet MS', system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #app {
    height: 100vh;
    height: 100dvh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(3vh, env(safe-area-inset-top)) 4vw max(3vh, env(safe-area-inset-bottom)) 4vw;
    gap: 3vh;
  }

  /* ---- circle ---- */
  #circleWrap {
    position: relative;
    width: min(50vh, 68vw);
    height: min(50vh, 68vw);
    flex-shrink: 0;
  }
  #circleBase, #circleFill, #circleOvertime {
    position: absolute;
    inset: 0;
    border-radius: 50%;
  }
  #circleBase {
    background: var(--fill);
    box-shadow: 0 0 0 10px rgba(255,255,255,0.04), 0 20px 60px rgba(0,0,0,0.45);
    transition: background 0.4s ease;
  }
  #circleFill {
    background: conic-gradient(from 0deg, #ffffff 0%, #ffffff 0%, transparent 0%, transparent 100%);
  }
  #circleOvertime {
    background: conic-gradient(from 0deg, var(--overtime) 0deg, var(--overtime) 0deg, transparent 0deg, transparent 360deg);
    pointer-events: none;
  }
  #ringOutline {
    position: absolute; inset: -10px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.08);
    pointer-events: none;
  }
  #centerLabel {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    background: rgba(15, 16, 33, 0.4);
    backdrop-filter: blur(6px);
    border-radius: 999px;
    padding: 2.2vh 3.5vw;
    min-width: 60%;
  }
  #timeDisplay {
    font-size: clamp(2.4rem, 9vh, 5rem);
    font-weight: 700;
    letter-spacing: 1px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  #statusLabel {
    margin-top: 0.6vh;
    font-size: clamp(0.7rem, 1.6vh, 1rem);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  /* ---- controls ---- */
  #controls {
    width: min(90vw, 640px);
    display: flex;
    flex-direction: column;
    gap: 2vh;
    align-items: center;
  }
  .row { display: flex; gap: 1.4vh; flex-wrap: wrap; justify-content: center; align-items: center; width: 100%; }

  .chip {
    background: var(--panel);
    color: var(--text);
    border: none;
    border-radius: 999px;
    padding: 1.4vh 3vw;
    font-size: clamp(0.9rem, 2vh, 1.15rem);
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.2s ease;
  }
  .chip:active { transform: scale(0.94); }
  .chip.selected { background: var(--fill); }

  .primary-row { gap: 2vh; }
  .btn-round {
    width: clamp(56px, 10vh, 88px);
    height: clamp(56px, 10vh, 88px);
    border-radius: 50%;
    border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.2s ease;
    font-size: clamp(1.2rem, 3.2vh, 1.8rem);
  }
  .btn-round:active { transform: scale(0.92); }

  #startPauseBtn { background: var(--good); color: #0c2a20; width: clamp(72px, 13vh, 110px); height: clamp(72px, 13vh, 110px); }
  #startPauseBtn.running { background: var(--bad); color: #3a0f0a; }
  #resetBtn { background: var(--panel); color: var(--text); }
  #micBtn { background: var(--accent); color: #3a2a00; }
  #micBtn.always-on {
    background: var(--good);
    color: #0c2a20;
    box-shadow: 0 0 0 4px rgba(79,209,165,0.25);
  }
  #micBtn.listening {
    background: var(--bad);
    animation: pulse 1.1s infinite ease-in-out;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,111,94,0.55); }
    50% { box-shadow: 0 0 0 16px rgba(255,111,94,0); }
  }

  #voiceFeedback {
    min-height: 3.4vh;
    font-size: clamp(0.8rem, 1.8vh, 1rem);
    color: var(--muted);
    text-align: center;
    max-width: 90vw;
  }

  #timeRow { flex-wrap: nowrap; }
  #customDurationBtn {
    width: clamp(38px, 6vh, 50px);
    height: clamp(38px, 6vh, 50px);
    font-size: clamp(0.9rem, 2vh, 1.2rem);
    background: var(--panel);
    color: var(--text);
    flex-shrink: 0;
  }

  #sliderWrap {
    width: min(74vw, 440px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6vh;
  }
  #sliderLabel {
    font-size: clamp(1rem, 2.4vh, 1.4rem);
    font-weight: 700;
  }
  #timeSlider {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: clamp(8px, 1.2vh, 12px);
    border-radius: 999px;
    background: var(--panel);
    outline: none;
  }
  #timeSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: clamp(28px, 4.2vh, 38px);
    height: clamp(28px, 4.2vh, 38px);
    border-radius: 50%;
    background: var(--fill);
    border: 3px solid var(--text);
    cursor: pointer;
  }
  #timeSlider::-moz-range-thumb {
    width: clamp(28px, 4.2vh, 38px);
    height: clamp(28px, 4.2vh, 38px);
    border-radius: 50%;
    background: var(--fill);
    border: 3px solid var(--text);
    cursor: pointer;
  }
  #sliderTicks {
    width: 100%;
    display: flex;
    justify-content: space-between;
    font-size: clamp(0.6rem, 1.4vh, 0.8rem);
    color: var(--muted);
    padding: 0 2px;
  }

  #wakeHint {
    position: absolute;
    bottom: 1.2vh; left: 50%; transform: translateX(-50%);
    font-size: 0.65rem;
    color: rgba(255,255,255,0.25);
    letter-spacing: 1px;
  }

  /* ---- color + numbers toggle ---- */
  #customColorWrap {
    position: relative;
    width: clamp(44px, 7vh, 60px);
    height: clamp(44px, 7vh, 60px);
  }
  #customColorInput {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: none;
    border-radius: 50%;
    padding: 0;
    cursor: pointer;
    background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
  }
  #customColorInput::-webkit-color-swatch-wrapper { padding: 2px; border-radius: 50%; }
  #customColorInput::-webkit-color-swatch { border: 3px solid rgba(255,255,255,0.5); border-radius: 50%; }

  #numbersToggleBtn, #autostartToggleBtn {
    display: flex; align-items: center; gap: 0.8vh;
  }
  #numbersToggleBtn .dot, #autostartToggleBtn .dot {
    width: 0.6em; height: 0.6em; border-radius: 50%;
    background: var(--good);
  }
  #numbersToggleBtn.off .dot, #autostartToggleBtn.off .dot { background: var(--muted); }

  #colorNumbersRow { justify-content: space-between; }
  #leftToggleColumn {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1.2vh;
  }

  /* ---- autostart modal ---- */
  #autostartModalOverlay, #customDurationOverlay {
    position: fixed; inset: 0;
    background: rgba(8, 9, 20, 0.72);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 4vh 4vw;
  }
  #autostartModalOverlay.open, #customDurationOverlay.open { display: flex; }
  #autostartModal, #customDurationModal {
    background: var(--panel);
    border-radius: 20px;
    padding: 3vh 5vw;
    width: min(92vw, 420px);
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  #autostartModal h2, #customDurationModal h2 {
    margin: 0 0 2vh 0;
    font-size: clamp(1.2rem, 3vh, 1.6rem);
  }
  #cdInputRow {
    border-top: none;
    justify-content: center;
    gap: 1vh;
  }
  #cdMinutesInput, #cdSecondsInput {
    background: var(--bg);
    border: none;
    border-radius: 10px;
    color: var(--text);
    padding: 1.2vh 0.4vh;
    font-size: clamp(1.1rem, 2.6vh, 1.4rem);
    font-weight: 700;
    text-align: center;
    width: 3em;
    font-variant-numeric: tabular-nums;
  }
  #cdMinutesInput:focus, #cdSecondsInput:focus { outline: 2px solid var(--accent); }
  .as-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.6vh 0;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: clamp(0.95rem, 2.2vh, 1.15rem);
    gap: 1.2vh;
  }
  .as-row:first-of-type { border-top: none; }
  #asTimeWrap {
    display: flex;
    align-items: center;
    gap: 0.5vh;
  }
  #asHourInput, #asMinuteInput {
    background: var(--bg);
    border: none;
    border-radius: 10px;
    color: var(--text);
    padding: 1vh 0.4vh;
    font-size: clamp(1rem, 2.4vh, 1.3rem);
    font-weight: 700;
    text-align: center;
    width: 2.2em;
    font-variant-numeric: tabular-nums;
  }
  #asHourInput:focus, #asMinuteInput:focus { outline: 2px solid var(--accent); }
  .as-time-colon { font-weight: 700; font-size: clamp(1rem, 2.4vh, 1.3rem); }
  #asAmPmBtn { padding: 1vh 2.2vw; margin-left: 0.4vh; }
  .switch {
    width: 52px; height: 30px;
    border-radius: 999px;
    border: none;
    background: var(--muted);
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.2s ease;
  }
  .switch.on { background: var(--good); }
  .switch-knob {
    position: absolute;
    top: 3px; left: 3px;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s ease;
  }
  .switch.on .switch-knob { transform: translateX(22px); }
  .as-days-row { flex-direction: column; align-items: stretch; gap: 1vh; }
  #asDays {
    display: flex;
    justify-content: space-between;
    gap: 0.8vh;
    width: 100%;
  }
  .as-day {
    flex: 1;
    aspect-ratio: 1;
    border-radius: 50%;
    border: none;
    background: var(--bg);
    color: var(--muted);
    font-weight: 700;
    font-size: clamp(0.8rem, 1.8vh, 1rem);
    cursor: pointer;
  }
  .as-day.on { background: var(--fill); color: #fff; }
  .as-actions { border-top: none; padding-top: 2.4vh; gap: 1.6vh; justify-content: flex-end; }
  .as-actions .chip { padding: 1.2vh 3.2vw; }
  #asSaveBtn { background: var(--good); color: #0c2a20; }

  #centerLabel { transition: opacity 0.25s ease; }
  #centerLabel.numbers-off { opacity: 0; pointer-events: none; }

  /* ---- minimal mode (after first start) ---- */
  #app { transition: gap 0.3s ease; }
  #circleWrap { transition: width 0.35s ease, height 0.35s ease; }
  #app.minimal #circleWrap {
    width: min(76vh, 90vw);
    height: min(76vh, 90vw);
  }
  #app.minimal #timeRow,
  #app.minimal #colorNumbersRow {
    display: none;
  }
  #app.minimal #voiceFeedback {
    display: none;
  }
  #app.minimal #voiceFeedback.active {
    display: block;
  }
  #app.minimal #controls { gap: 2.4vh; }

  @media (prefers-reduced-motion: reduce) {
    #micBtn.listening { animation: none; }
  }

  /* ---- landscape layout ---- */
  #app.layout-landscape {
    flex-direction: row;
    gap: 4vw;
  }
  #app.layout-landscape #controls {
    width: auto;
    max-width: 46vw;
  }
  #app.layout-landscape #sliderWrap {
    width: min(38vw, 420px);
  }
  #app.layout-landscape #circleWrap {
    width: min(62vh, 44vw);
    height: min(62vh, 44vw);
  }
  #app.layout-landscape.minimal #circleWrap {
    width: min(84vh, 52vw);
    height: min(84vh, 52vw);
  }

  /* ---- orientation fallback toggle (only shown if auto-detection is unavailable) ---- */
  #orientationToggleBtn {
    position: fixed;
    top: max(1.2vh, env(safe-area-inset-top));
    left: max(1.2vh, env(safe-area-inset-left));
    width: clamp(36px, 6vh, 46px);
    height: clamp(36px, 6vh, 46px);
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.1);
    color: var(--text);
    font-size: clamp(1rem, 2.4vh, 1.3rem);
    cursor: pointer;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>
<div id="app">

  <div id="circleWrap">
    <div id="circleBase"></div>
    <div id="circleFill"></div>
    <div id="circleOvertime"></div>
    <div id="ringOutline"></div>
    <div id="centerLabel">
      <div id="timeDisplay">05:00</div>
      <div id="statusLabel">Ready</div>
    </div>
  </div>

  <div id="controls">
    <div class="row" id="timeRow">
      <div id="sliderWrap">
        <div id="sliderLabel">5 min</div>
        <input type="range" id="timeSlider" min="0" max="8" step="1" value="4" aria-label="Timer duration in minutes">
        <div id="sliderTicks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>10</span><span>15</span><span>20</span><span>30</span></div>
      </div>
      <button class="btn-round" id="customDurationBtn" title="Enter custom duration" aria-label="Enter custom duration">&#9999;</button>
    </div>

    <div class="row primary-row">
      <button class="btn-round" id="resetBtn" title="Reset" aria-label="Reset">&#8634;</button>
      <button class="btn-round" id="startPauseBtn" title="Start" aria-label="Start">&#9654;</button>
      <button class="btn-round" id="micBtn" title="Toggle voice control" aria-label="Turn on voice control">&#127908;</button>
    </div>

    <div class="row" id="colorNumbersRow">
      <div id="leftToggleColumn">
        <button class="chip" id="autostartToggleBtn"><span class="dot"></span><span id="autostartToggleLabel">Autostart: Off</span></button>
        <button class="chip" id="numbersToggleBtn"><span class="dot"></span><span id="numbersToggleLabel">Numbers: On</span></button>
      </div>
      <div id="customColorWrap" title="Choose color" aria-label="Choose color">
        <input type="color" id="customColorInput" value="#ff6f5e" list="colorPresets">
      </div>
      <datalist id="colorPresets">
        <option value="#ff6f5e"></option>
        <option value="#ffb703"></option>
        <option value="#4fd1a5"></option>
        <option value="#4c9aff"></option>
        <option value="#9b6bff"></option>
        <option value="#ff6bb0"></option>
      </datalist>
    </div>

    <div id="voiceFeedback">Tap the mic once to turn on voice control, then just speak — "set timer for 10 minutes", "start", "hide numbers", "change color to blue"</div>
  </div>

  <div id="wakeHint"></div>
  <button id="orientationToggleBtn" title="Toggle layout orientation" aria-label="Switch to landscape layout">&#8646;</button>

  <div id="autostartModalOverlay">
    <div id="autostartModal">
      <h2>Autostart</h2>
      <div class="as-row">
        <span>Enabled</span>
        <button id="asEnabledSwitch" class="switch" role="switch" aria-checked="false" aria-label="Enable autostart"><span class="switch-knob"></span></button>
      </div>
      <div class="as-row">
        <span>Start time</span>
        <div id="asTimeWrap">
          <input type="text" id="asHourInput" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="07" aria-label="Hour">
          <span class="as-time-colon">:</span>
          <input type="text" id="asMinuteInput" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="00" aria-label="Minute">
          <button type="button" id="asAmPmBtn" class="chip" data-value="AM">AM</button>
        </div>
      </div>
      <div class="as-row as-days-row">
        <span>Repeat on</span>
        <div id="asDays">
          <button class="as-day" data-day="0">S</button>
          <button class="as-day" data-day="1">M</button>
          <button class="as-day" data-day="2">T</button>
          <button class="as-day" data-day="3">W</button>
          <button class="as-day" data-day="4">T</button>
          <button class="as-day" data-day="5">F</button>
          <button class="as-day" data-day="6">S</button>
        </div>
      </div>
      <div class="as-row as-actions">
        <button class="chip" id="asCancelBtn">Cancel</button>
        <button class="chip" id="asSaveBtn">Save</button>
      </div>
    </div>
  </div>

  <div id="customDurationOverlay">
    <div id="customDurationModal">
      <h2>Custom duration</h2>
      <div class="as-row" id="cdInputRow">
        <input type="text" id="cdMinutesInput" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="00" aria-label="Minutes">
        <span class="as-time-colon">min</span>
        <input type="text" id="cdSecondsInput" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="00" aria-label="Seconds">
        <span class="as-time-colon">sec</span>
      </div>
      <div class="as-row as-actions">
        <button class="chip" id="cdCancelBtn">Cancel</button>
        <button class="chip" id="cdSaveBtn">Set</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  const circleFill = document.getElementById('circleFill');
  const circleOvertime = document.getElementById('circleOvertime');
  const timeDisplay = document.getElementById('timeDisplay');
  const statusLabel = document.getElementById('statusLabel');
  const startPauseBtn = document.getElementById('startPauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const micBtn = document.getElementById('micBtn');
  const voiceFeedback = document.getElementById('voiceFeedback');
  const timeSlider = document.getElementById('timeSlider');
  const sliderLabel = document.getElementById('sliderLabel');
  const wakeHint = document.getElementById('wakeHint');
  const customColorInput = document.getElementById('customColorInput');
  const numbersToggleBtn = document.getElementById('numbersToggleBtn');
  const numbersToggleLabel = document.getElementById('numbersToggleLabel');
  const centerLabel = document.getElementById('centerLabel');
  const circleBase = document.getElementById('circleBase');
  const autostartToggleBtn = document.getElementById('autostartToggleBtn');
  const autostartToggleLabel = document.getElementById('autostartToggleLabel');
  const autostartModalOverlay = document.getElementById('autostartModalOverlay');
  const asEnabledSwitch = document.getElementById('asEnabledSwitch');
  const asHourInput = document.getElementById('asHourInput');
  const asMinuteInput = document.getElementById('asMinuteInput');
  const asAmPmBtn = document.getElementById('asAmPmBtn');
  const asDays = document.getElementById('asDays');
  const asCancelBtn = document.getElementById('asCancelBtn');
  const asSaveBtn = document.getElementById('asSaveBtn');
  const customDurationBtn = document.getElementById('customDurationBtn');
  const customDurationOverlay = document.getElementById('customDurationOverlay');
  const cdMinutesInput = document.getElementById('cdMinutesInput');
  const cdSecondsInput = document.getElementById('cdSecondsInput');
  const cdCancelBtn = document.getElementById('cdCancelBtn');
  const cdSaveBtn = document.getElementById('cdSaveBtn');

  const TIME_OPTIONS = [1, 2, 3, 4, 5, 10, 15, 20, 30];

  const appRoot = document.getElementById('app');
  let totalSeconds = 5 * 60;
  let remainingSeconds = totalSeconds;
  let running = false;
  let tickHandle = null;
  let lastTick = null;
  let numbersVisible = true;
  let hasStarted = false;
  let inOvertime = false;
  let overtimeSeconds = 0;
  const MAX_OVERTIME = 3600; // 1 hour

  // ---- autostart (daily alarm, no sound, just starts the timer) ----
  const AUTOSTART_KEY = 'wallTimerAutostart';
  let autostart = { enabled: false, time: '07:00', days: [1, 2, 3, 4, 5] }; // Mon-Fri default
  let autostartLastTriggeredDate = null; // 'YYYY-MM-DD' to avoid re-firing within the same day

  function loadAutostart() {
    try {
      const raw = localStorage.getItem(AUTOSTART_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') {
          autostart = {
            enabled: !!parsed.enabled,
            time: typeof parsed.time === 'string' ? parsed.time : '07:00',
            days: Array.isArray(parsed.days) ? parsed.days.filter(d => d >= 0 && d <= 6) : [1, 2, 3, 4, 5]
          };
        }
      }
    } catch (e) { /* localStorage unavailable; fall back to default in-memory settings */ }
  }

  function saveAutostart() {
    try { localStorage.setItem(AUTOSTART_KEY, JSON.stringify(autostart)); } catch (e) {}
  }

  function dayAbbrev(list) {
    const labels = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const sorted = [...list].sort();
    if (sorted.length === 7) return 'daily';
    if (sorted.join(',') === '1,2,3,4,5') return 'weekdays';
    if (sorted.join(',') === '0,6') return 'weekends';
    return sorted.map(d => labels[d]).join(' ');
  }

  function formatTimeLabel(hhmm) {
    const [h, m] = hhmm.split(':').map(Number);
    const period = h >= 12 ? 'PM' : 'AM';
    const h12 = ((h + 11) % 12) + 1;
    return h12 + ':' + String(m).padStart(2, '0') + ' ' + period;
  }

  function to24h(hour12, minute, ampm) {
    let h = hour12 % 12;
    if (ampm === 'PM') h += 12;
    return String(h).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
  }

  function from24h(hhmm) {
    const [h, m] = hhmm.split(':').map(Number);
    const ampm = h >= 12 ? 'PM' : 'AM';
    const h12 = ((h + 11) % 12) + 1;
    return { h12, m, ampm };
  }

  function renderAutostartButton() {
    autostartToggleBtn.classList.toggle('off', !autostart.enabled);
    autostartToggleLabel.textContent = autostart.enabled
      ? `Autostart: ${formatTimeLabel(autostart.time)} ${dayAbbrev(autostart.days)}`
      : 'Autostart: Off';
  }

  function openAutostartModal() {
    asEnabledSwitch.classList.toggle('on', autostart.enabled);
    asEnabledSwitch.setAttribute('aria-checked', String(autostart.enabled));
    const { h12, m, ampm } = from24h(autostart.time);
    asHourInput.value = String(h12);
    asMinuteInput.value = String(m).padStart(2, '0');
    asAmPmBtn.textContent = ampm;
    asAmPmBtn.dataset.value = ampm;
    document.querySelectorAll('.as-day').forEach(btn => {
      btn.classList.toggle('on', autostart.days.includes(Number(btn.dataset.day)));
    });
    autostartModalOverlay.classList.add('open');
  }

  function closeAutostartModal() {
    autostartModalOverlay.classList.remove('open');
  }

  function checkAutostart() {
    if (!autostart.enabled) return;
    if (running) return; // don't interrupt an active countdown or overtime
    const now = new Date();
    const todayKey = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    if (autostartLastTriggeredDate === todayKey) return;
    if (!autostart.days.includes(now.getDay())) return;
    const hhmm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    if (hhmm !== autostart.time) return;
    autostartLastTriggeredDate = todayKey;
    remainingSeconds = totalSeconds;
    inOvertime = false;
    overtimeSeconds = 0;
    start();
  }

  function requestFS() {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (req) {
      try {
        const result = req.call(el);
        if (result && result.catch) result.catch(() => {});
      } catch (e) { /* requires a user gesture; ignore if unavailable */ }
    }
  }
  function exitFS() {
    if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
      if (exit) {
        try {
          const result = exit.call(document);
          if (result && result.catch) result.catch(() => {});
        } catch (e) {}
      }
    }
  }

  function enterMinimal() {
    hasStarted = true;
    appRoot.classList.add('minimal');
    requestFS();
  }
  function exitMinimal() {
    hasStarted = false;
    appRoot.classList.remove('minimal');
    exitFS();
  }

  const NAMED_COLORS = {
    red: '#ff5a4e', orange: '#ff8c42', amber: '#ffb703', yellow: '#ffd60a',
    green: '#4fd1a5', teal: '#2dd4bf', blue: '#4c9aff', purple: '#9b6bff',
    indigo: '#7c6bff', pink: '#ff6bb0', coral: '#ff6f5e', white: '#f4f2ff'
  };

  function setFillColor(hex) {
    document.documentElement.style.setProperty('--fill', hex);
    customColorInput.value = hex;
  }

  function setNumbersVisible(visible) {
    numbersVisible = visible;
    centerLabel.classList.toggle('numbers-off', !visible);
    numbersToggleBtn.classList.toggle('off', !visible);
    numbersToggleLabel.textContent = 'Numbers: ' + (visible ? 'On' : 'Off');
  }

  function formatTime(s) {
    s = Math.max(0, Math.round(s));
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  }

  function render() {
    const pct = totalSeconds > 0 ? Math.min(1, (totalSeconds - remainingSeconds) / totalSeconds) : 0;
    const deg = pct * 360;
    circleFill.style.background =
      `conic-gradient(from 0deg, #ffffff 0deg, #ffffff ${deg}deg, transparent ${deg}deg, transparent 360deg)`;

    const otPct = Math.min(1, overtimeSeconds / MAX_OVERTIME);
    const otDeg = otPct * 360;
    circleOvertime.style.background =
      `conic-gradient(from 0deg, var(--overtime) 0deg, var(--overtime) ${otDeg}deg, transparent ${otDeg}deg, transparent 360deg)`;

    if (inOvertime) {
      timeDisplay.textContent = '+' + formatTime(overtimeSeconds);
      statusLabel.textContent = overtimeSeconds >= MAX_OVERTIME ? 'Overtime complete' : (running ? 'Overtime' : 'Overtime (paused)');
    } else {
      timeDisplay.textContent = formatTime(remainingSeconds);
      if (running) {
        statusLabel.textContent = 'Running';
      } else if (remainingSeconds < totalSeconds) {
        statusLabel.textContent = 'Paused';
      } else {
        statusLabel.textContent = 'Ready';
      }
    }

    startPauseBtn.innerHTML = running ? '&#10074;&#10074;' : '&#9654;';
    startPauseBtn.classList.toggle('running', running);
    startPauseBtn.setAttribute('aria-label', running ? 'Pause' : 'Start');
    startPauseBtn.disabled = inOvertime && overtimeSeconds >= MAX_OVERTIME;
    startPauseBtn.style.opacity = startPauseBtn.disabled ? '0.5' : '1';
  }

  function tick(ts) {
    if (!running) return;
    if (lastTick == null) lastTick = ts;
    const dt = (ts - lastTick) / 1000;
    lastTick = ts;

    if (!inOvertime) {
      remainingSeconds -= dt;
      if (remainingSeconds <= 0) {
        remainingSeconds = 0;
        inOvertime = true;
        overtimeSeconds = 0;
        render();
        onFinish();
        tickHandle = requestAnimationFrame(tick);
        return;
      }
      render();
      tickHandle = requestAnimationFrame(tick);
    } else {
      overtimeSeconds += dt;
      if (overtimeSeconds >= MAX_OVERTIME) {
        overtimeSeconds = MAX_OVERTIME;
        running = false;
        render();
        onFinish();
        return;
      }
      render();
      tickHandle = requestAnimationFrame(tick);
    }
  }

  function start() {
    if (running) return;
    if (inOvertime && overtimeSeconds >= MAX_OVERTIME) return;
    if (!inOvertime && remainingSeconds <= 0) return;
    running = true;
    lastTick = null;
    enterMinimal();
    render();
    tickHandle = requestAnimationFrame(tick);
    requestWakeLock();
  }

  function pause() {
    running = false;
    if (tickHandle) cancelAnimationFrame(tickHandle);
    render();
  }

  function toggleStartPause() {
    if (running) pause(); else start();
  }

  function reset() {
    pause();
    remainingSeconds = totalSeconds;
    inOvertime = false;
    overtimeSeconds = 0;
    exitMinimal();
    render();
  }

  function syncSliderToDuration() {
    const currentMinutes = totalSeconds / 60;
    let idx = 0, bestDiff = Infinity;
    TIME_OPTIONS.forEach((m, i) => {
      const diff = Math.abs(m - currentMinutes);
      if (diff < bestDiff) { bestDiff = diff; idx = i; }
    });
    timeSlider.value = idx;
    // Show the exact duration whenever it isn't a whole minute matching a preset exactly,
    // so a custom entry like "2 min 30 sec" reads correctly instead of snapping to a label.
    const isExactPresetMinutes = totalSeconds % 60 === 0 && TIME_OPTIONS.includes(totalSeconds / 60);
    sliderLabel.textContent = isExactPresetMinutes ? (totalSeconds / 60) + ' min' : formatTime(totalSeconds);
  }

  function setDuration(minutes) {
    setDurationSeconds(Math.max(1, Math.round(minutes * 60)));
  }

  function setDurationSeconds(seconds) {
    pause();
    totalSeconds = Math.max(1, Math.round(seconds));
    remainingSeconds = totalSeconds;
    inOvertime = false;
    overtimeSeconds = 0;
    syncSliderToDuration();
    render();
  }

VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV";
  let alarmCtx = null;
  let alarmBuffer = null;

  function base64ToArrayBuffer(base64) {
    const binaryString = atob(base64);
    const len = binaryString.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);
    return bytes.buffer;
  }

  async function onFinish() {
    try {
      alarmCtx = alarmCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (alarmCtx.state === 'suspended') await alarmCtx.resume();
      if (!alarmBuffer) {
        const arrayBuffer = base64ToArrayBuffer(ALARM_BASE64);
        alarmBuffer = await alarmCtx.decodeAudioData(arrayBuffer);
      }
      const now = alarmCtx.currentTime;
      [0, 1.5, 3.0, 4.5].forEach(delay => {
        const source = alarmCtx.createBufferSource();
        source.buffer = alarmBuffer;
        source.connect(alarmCtx.destination);
        source.start(now + delay);
      });
    } catch (e) { /* audio not available */ }
    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
  }

  // ---- controls wiring ----
  timeSlider.addEventListener('input', () => {
    const idx = Number(timeSlider.value);
    const minutes = TIME_OPTIONS[idx];
    sliderLabel.textContent = minutes + ' min';
    setDuration(minutes);
  });

  startPauseBtn.addEventListener('click', toggleStartPause);
  resetBtn.addEventListener('click', reset);

  customColorInput.addEventListener('input', (e) => setFillColor(e.target.value));

  numbersToggleBtn.addEventListener('click', () => setNumbersVisible(!numbersVisible));

  autostartToggleBtn.addEventListener('click', openAutostartModal);
  asEnabledSwitch.addEventListener('click', () => {
    const next = !asEnabledSwitch.classList.contains('on');
    asEnabledSwitch.classList.toggle('on', next);
    asEnabledSwitch.setAttribute('aria-checked', String(next));
  });
  asDays.addEventListener('click', (e) => {
    const btn = e.target.closest('.as-day');
    if (!btn) return;
    btn.classList.toggle('on');
  });
  // numeric-only input + auto-advance from hour to minute
  asHourInput.addEventListener('input', () => {
    asHourInput.value = asHourInput.value.replace(/\D/g, '').slice(0, 2);
    if (asHourInput.value.length === 2) asMinuteInput.focus();
  });
  asMinuteInput.addEventListener('input', () => {
    asMinuteInput.value = asMinuteInput.value.replace(/\D/g, '').slice(0, 2);
  });
  asHourInput.addEventListener('blur', () => {
    let h = parseInt(asHourInput.value, 10);
    if (isNaN(h) || h < 1) h = 12;
    if (h > 12) h = 12;
    asHourInput.value = String(h);
  });
  asMinuteInput.addEventListener('blur', () => {
    let m = parseInt(asMinuteInput.value, 10);
    if (isNaN(m) || m < 0) m = 0;
    if (m > 59) m = 59;
    asMinuteInput.value = String(m).padStart(2, '0');
  });
  asAmPmBtn.addEventListener('click', () => {
    const next = asAmPmBtn.dataset.value === 'AM' ? 'PM' : 'AM';
    asAmPmBtn.dataset.value = next;
    asAmPmBtn.textContent = next;
  });

  asCancelBtn.addEventListener('click', closeAutostartModal);
  asSaveBtn.addEventListener('click', () => {
    const selectedDays = Array.from(document.querySelectorAll('.as-day.on')).map(b => Number(b.dataset.day));
    let h = parseInt(asHourInput.value, 10);
    if (isNaN(h) || h < 1 || h > 12) h = 7;
    let m = parseInt(asMinuteInput.value, 10);
    if (isNaN(m) || m < 0 || m > 59) m = 0;
    autostart = {
      enabled: asEnabledSwitch.classList.contains('on'),
      time: to24h(h, m, asAmPmBtn.dataset.value || 'AM'),
      days: selectedDays.length ? selectedDays : [1, 2, 3, 4, 5]
    };
    autostartLastTriggeredDate = null;
    saveAutostart();
    renderAutostartButton();
    closeAutostartModal();
  });
  autostartModalOverlay.addEventListener('click', (e) => {
    if (e.target === autostartModalOverlay) closeAutostartModal();
  });

  setInterval(checkAutostart, 15000);

  // ---- custom duration entry ----
  function openCustomDurationModal() {
    const mins = Math.floor(totalSeconds / 60);
    const secs = totalSeconds % 60;
    cdMinutesInput.value = String(mins);
    cdSecondsInput.value = String(secs).padStart(2, '0');
    customDurationOverlay.classList.add('open');
    cdMinutesInput.focus();
    cdMinutesInput.select();
  }
  function closeCustomDurationModal() {
    customDurationOverlay.classList.remove('open');
  }

  cdMinutesInput.addEventListener('input', () => {
    cdMinutesInput.value = cdMinutesInput.value.replace(/\D/g, '').slice(0, 3);
  });
  cdSecondsInput.addEventListener('input', () => {
    cdSecondsInput.value = cdSecondsInput.value.replace(/\D/g, '').slice(0, 2);
  });
  cdSecondsInput.addEventListener('blur', () => {
    let s = parseInt(cdSecondsInput.value, 10);
    if (isNaN(s) || s < 0) s = 0;
    if (s > 59) s = 59;
    cdSecondsInput.value = String(s).padStart(2, '0');
  });

  customDurationBtn.addEventListener('click', openCustomDurationModal);
  cdCancelBtn.addEventListener('click', closeCustomDurationModal);
  cdSaveBtn.addEventListener('click', () => {
    let mins = parseInt(cdMinutesInput.value, 10);
    if (isNaN(mins) || mins < 0) mins = 0;
    let secs = parseInt(cdSecondsInput.value, 10);
    if (isNaN(secs) || secs < 0) secs = 0;
    if (secs > 59) secs = 59;
    const totalSecondsEntered = mins * 60 + secs;
    if (totalSecondsEntered <= 0) {
      cdMinutesInput.focus();
      return;
    }
    setDurationSeconds(totalSecondsEntered);
    closeCustomDurationModal();
  });
  customDurationOverlay.addEventListener('click', (e) => {
    if (e.target === customDurationOverlay) closeCustomDurationModal();
  });

  // ---- wake lock (keep screen on while mounted) ----
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeHint.textContent = '';
      }
    } catch (e) {
      wakeHint.textContent = 'Screen may sleep — disable auto-lock in tablet settings';
    }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && running) requestWakeLock();
  });

  // ---- voice control ----
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;

  function parseAndRun(transcript) {
    const t = transcript.toLowerCase().trim();
    voiceFeedback.textContent = 'Heard: "' + transcript + '"';

    // set timer for X minutes/seconds
    const setMatch = t.match(/(?:set|start)[^\d]*?(\d+(?:\.\d+)?)\s*(hour|hr|minute|min|second|sec)/);
    if (setMatch) {
      let value = parseFloat(setMatch[1]);
      const unit = setMatch[2];
      let minutes;
      if (unit.startsWith('hour') || unit.startsWith('hr')) minutes = value * 60;
      else if (unit.startsWith('min')) minutes = value;
      else minutes = value / 60;
      setDuration(minutes);
      if (t.includes('start') || t.includes('go')) start();
      voiceFeedback.textContent = `Set to ${formatTime(totalSeconds)}${(t.includes('start') || t.includes('go')) ? ' and started' : ''}`;
      return;
    }

    // add X minutes
    const addMatch = t.match(/add\s*(\d+(?:\.\d+)?)\s*(minute|min|second|sec)/);
    if (addMatch) {
      const value = parseFloat(addMatch[1]);
      const unit = addMatch[2];
      const addSeconds = unit.startsWith('min') ? value * 60 : value;
      if (inOvertime) {
        inOvertime = false;
        overtimeSeconds = 0;
        totalSeconds = addSeconds;
        remainingSeconds = addSeconds;
        syncSliderToDuration();
        voiceFeedback.textContent = `Starting a fresh ${addMatch[1]} ${unit} countdown`;
      } else {
        totalSeconds += addSeconds;
        remainingSeconds += addSeconds;
        voiceFeedback.textContent = `Added ${addMatch[1]} ${unit}`;
      }
      render();
      return;
    }

    if (/\b(pause|stop|halt)\b/.test(t)) {
      pause();
      voiceFeedback.textContent = 'Paused';
      return;
    }
    if (/\b(start|resume|go|begin)\b/.test(t)) {
      start();
      voiceFeedback.textContent = 'Started';
      return;
    }
    if (/\b(reset|restart|clear)\b/.test(t)) {
      reset();
      voiceFeedback.textContent = 'Reset';
      return;
    }

    if (/\b(hide|turn off|numbers off)\b.*\bnumbers?\b|\bnumbers?\b.*\boff\b/.test(t)) {
      setNumbersVisible(false);
      voiceFeedback.textContent = 'Numbers hidden';
      return;
    }
    if (/\b(show|turn on|numbers on)\b.*\bnumbers?\b|\bnumbers?\b.*\bon\b/.test(t)) {
      setNumbersVisible(true);
      voiceFeedback.textContent = 'Numbers shown';
      return;
    }

    const colorMatch = t.match(/\bcolor\s*(?:to)?\s*([a-z]+)\b/);
    if (colorMatch && NAMED_COLORS[colorMatch[1]]) {
      setFillColor(NAMED_COLORS[colorMatch[1]]);
      voiceFeedback.textContent = 'Color set to ' + colorMatch[1];
      return;
    }

    voiceFeedback.textContent = `Didn't catch a command in: "${transcript}"`;
  }

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    let alwaysListening = false;
    let restartTimer = null;

    let feedbackHideTimer = null;
    function showFeedback() {
      voiceFeedback.classList.add('active');
      if (feedbackHideTimer) clearTimeout(feedbackHideTimer);
    }
    function scheduleHideFeedback() {
      if (feedbackHideTimer) clearTimeout(feedbackHideTimer);
      feedbackHideTimer = setTimeout(() => voiceFeedback.classList.remove('active'), 3000);
    }

    recognition.onstart = () => {
      listening = true;
      micBtn.classList.add('listening');
    };
    recognition.onresult = (event) => {
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) {
          parseAndRun(event.results[i][0].transcript);
        }
      }
      showFeedback();
    };
    recognition.onerror = (event) => {
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        alwaysListening = false;
        voiceFeedback.textContent = 'Mic blocked — check the address bar and allow Microphone for this page';
        showFeedback();
      } else if (event.error === 'network') {
        voiceFeedback.textContent = 'Voice network error — check WiFi connection';
        showFeedback();
      }
      // no-speech / aborted are routine in always-on mode; onend handles the restart silently
    };
    recognition.onend = () => {
      listening = false;
      micBtn.classList.remove('listening');
      scheduleHideFeedback();
      if (alwaysListening) {
        if (restartTimer) clearTimeout(restartTimer);
        restartTimer = setTimeout(() => {
          try { recognition.start(); } catch (e) { /* already running */ }
        }, 300);
      }
    };

    micBtn.addEventListener('click', () => {
      if (alwaysListening) {
        alwaysListening = false;
        if (restartTimer) clearTimeout(restartTimer);
        micBtn.classList.remove('always-on');
        micBtn.setAttribute('aria-label', 'Turn on voice control');
        voiceFeedback.textContent = 'Voice control off';
        showFeedback();
        scheduleHideFeedback();
        try { recognition.stop(); } catch (e) {}
      } else {
        alwaysListening = true;
        micBtn.classList.add('always-on');
        micBtn.setAttribute('aria-label', 'Turn off voice control');
        voiceFeedback.textContent = 'Voice control on — just speak your command anytime';
        showFeedback();
        scheduleHideFeedback();
        try { recognition.start(); } catch (e) {}
      }
    });
  } else {
    micBtn.disabled = true;
    micBtn.style.opacity = '0.35';
    voiceFeedback.textContent = 'Voice control needs Chrome. Use the buttons above instead.';
  }

  const orientationToggleBtn = document.getElementById('orientationToggleBtn');

  const orientationMQ = window.matchMedia ? window.matchMedia('(orientation: landscape)') : null;
  let manualOrientation = null; // null = auto (from matchMedia); 'landscape' | 'portrait' = forced

  function applyLayout() {
    let isLandscape;
    if (manualOrientation) {
      isLandscape = manualOrientation === 'landscape';
    } else if (orientationMQ) {
      isLandscape = orientationMQ.matches;
    } else {
      isLandscape = window.innerWidth > window.innerHeight;
    }
    appRoot.classList.toggle('layout-landscape', isLandscape);
  }

  if (orientationMQ) {
    // Browser can detect orientation — switch automatically, no manual toggle needed.
    orientationMQ.addEventListener('change', () => { if (!manualOrientation) applyLayout(); });
  } else {
    // No orientation detection available — show a manual fallback toggle.
    orientationToggleBtn.style.display = 'flex';
    manualOrientation = window.innerWidth > window.innerHeight ? 'landscape' : 'portrait';
    orientationToggleBtn.addEventListener('click', () => {
      manualOrientation = manualOrientation === 'landscape' ? 'portrait' : 'landscape';
      orientationToggleBtn.setAttribute('aria-label', manualOrientation === 'landscape' ? 'Switch to portrait layout' : 'Switch to landscape layout');
      applyLayout();
    });
  }
  window.addEventListener('resize', () => { if (!orientationMQ) applyLayout(); });
  applyLayout();

  setFillColor('#ff6f5e');
  setNumbersVisible(true);
  syncSliderToDuration();
  loadAutostart();
  renderAutostartButton();
  render();
})();
</script>
</body>
