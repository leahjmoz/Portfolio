<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Countdown Timer</title>
<style>
  :root {
    --bg: #171a2e;
    --panel: #21254a;
    --fill: #ff6f5e;
    --accent: #ffd166;
    --text: #f4f2ff;
    --muted: #8b8fc2;
    --good: #4fd1a5;
    --bad: #ff6f5e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100vh;
    height: 100dvh;
    background: radial-gradient(circle at 50% -10%, #262a52 0%, var(--bg) 60%);
    color: var(--text);
    font-family: 'Segoe UI Rounded', 'SF Pro Rounded', 'Trebuchet MS', system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #app {
    height: 100vh;
    height: 100dvh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(3vh, env(safe-area-inset-top)) 4vw max(3vh, env(safe-area-inset-bottom)) 4vw;
    gap: 3vh;
  }

  /* ---- circle ---- */
  #circleWrap {
    position: relative;
    width: min(50vh, 68vw);
    height: min(50vh, 68vw);
    flex-shrink: 0;
  }
  #circleBase, #circleFill {
    position: absolute;
    inset: 0;
    border-radius: 50%;
  }
  #circleBase {
    background: var(--fill);
    box-shadow: 0 0 0 10px rgba(255,255,255,0.04), 0 20px 60px rgba(0,0,0,0.45);
    transition: background 0.4s ease;
  }
  #circleFill {
    background: conic-gradient(from 0deg, #ffffff 0%, #ffffff 0%, transparent 0%, transparent 100%);
  }
  #ringOutline {
    position: absolute; inset: -10px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.08);
    pointer-events: none;
  }
  #centerLabel {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    background: rgba(15, 16, 33, 0.4);
    backdrop-filter: blur(6px);
    border-radius: 999px;
    padding: 2.2vh 3.5vw;
    min-width: 60%;
  }
  #timeDisplay {
    font-size: clamp(2.4rem, 9vh, 5rem);
    font-weight: 700;
    letter-spacing: 1px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  #statusLabel {
    margin-top: 0.6vh;
    font-size: clamp(0.7rem, 1.6vh, 1rem);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  /* ---- controls ---- */
  #controls {
    width: min(90vw, 640px);
    display: flex;
    flex-direction: column;
    gap: 2vh;
    align-items: center;
  }
  .row { display: flex; gap: 1.4vh; flex-wrap: wrap; justify-content: center; align-items: center; width: 100%; }

  .chip {
    background: var(--panel);
    color: var(--text);
    border: none;
    border-radius: 999px;
    padding: 1.4vh 3vw;
    font-size: clamp(0.9rem, 2vh, 1.15rem);
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.2s ease;
  }
  .chip:active { transform: scale(0.94); }
  .chip.selected { background: var(--fill); }

  .primary-row { gap: 2vh; }
  .btn-round {
    width: clamp(56px, 10vh, 88px);
    height: clamp(56px, 10vh, 88px);
    border-radius: 50%;
    border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.2s ease;
    font-size: clamp(1.2rem, 3.2vh, 1.8rem);
  }
  .btn-round:active { transform: scale(0.92); }

  #startPauseBtn { background: var(--good); color: #0c2a20; width: clamp(72px, 13vh, 110px); height: clamp(72px, 13vh, 110px); }
  #startPauseBtn.running { background: var(--bad); color: #3a0f0a; }
  #resetBtn { background: var(--panel); color: var(--text); }
  #micBtn { background: var(--accent); color: #3a2a00; }
  #micBtn.always-on {
    background: var(--good);
    color: #0c2a20;
    box-shadow: 0 0 0 4px rgba(79,209,165,0.25);
  }
  #micBtn.listening {
    background: var(--bad);
    animation: pulse 1.1s infinite ease-in-out;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,111,94,0.55); }
    50% { box-shadow: 0 0 0 16px rgba(255,111,94,0); }
  }

  #voiceFeedback {
    min-height: 3.4vh;
    font-size: clamp(0.8rem, 1.8vh, 1rem);
    color: var(--muted);
    text-align: center;
    max-width: 90vw;
  }

  #sliderWrap {
    width: min(85vw, 480px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6vh;
  }
  #sliderLabel {
    font-size: clamp(1rem, 2.4vh, 1.4rem);
    font-weight: 700;
  }
  #timeSlider {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: clamp(8px, 1.2vh, 12px);
    border-radius: 999px;
    background: var(--panel);
    outline: none;
  }
  #timeSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: clamp(28px, 4.2vh, 38px);
    height: clamp(28px, 4.2vh, 38px);
    border-radius: 50%;
    background: var(--fill);
    border: 3px solid var(--text);
    cursor: pointer;
  }
  #timeSlider::-moz-range-thumb {
    width: clamp(28px, 4.2vh, 38px);
    height: clamp(28px, 4.2vh, 38px);
    border-radius: 50%;
    background: var(--fill);
    border: 3px solid var(--text);
    cursor: pointer;
  }
  #sliderTicks {
    width: 100%;
    display: flex;
    justify-content: space-between;
    font-size: clamp(0.6rem, 1.4vh, 0.8rem);
    color: var(--muted);
    padding: 0 2px;
  }

  #wakeHint {
    position: absolute;
    bottom: 1.2vh; left: 50%; transform: translateX(-50%);
    font-size: 0.65rem;
    color: rgba(255,255,255,0.25);
    letter-spacing: 1px;
  }

  /* ---- color + numbers toggle ---- */
  #customColorWrap {
    position: relative;
    width: clamp(44px, 7vh, 60px);
    height: clamp(44px, 7vh, 60px);
  }
  #customColorInput {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: none;
    border-radius: 50%;
    padding: 0;
    cursor: pointer;
    background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
  }
  #customColorInput::-webkit-color-swatch-wrapper { padding: 2px; border-radius: 50%; }
  #customColorInput::-webkit-color-swatch { border: 3px solid rgba(255,255,255,0.5); border-radius: 50%; }

  #numbersToggleBtn {
    display: flex; align-items: center; gap: 0.8vh;
  }
  #numbersToggleBtn .dot {
    width: 0.6em; height: 0.6em; border-radius: 50%;
    background: var(--good);
  }
  #numbersToggleBtn.off .dot { background: var(--muted); }

  #centerLabel { transition: opacity 0.25s ease; }
  #centerLabel.numbers-off { opacity: 0; pointer-events: none; }

  /* ---- minimal mode (after first start) ---- */
  #app { transition: gap 0.3s ease; }
  #circleWrap { transition: width 0.35s ease, height 0.35s ease; }
  #app.minimal #circleWrap {
    width: min(76vh, 90vw);
    height: min(76vh, 90vw);
  }
  #app.minimal #timeRow,
  #app.minimal #colorNumbersRow {
    display: none;
  }
  #app.minimal #voiceFeedback {
    display: none;
  }
  #app.minimal #voiceFeedback.active {
    display: block;
  }
  #app.minimal #controls { gap: 2.4vh; }

  @media (prefers-reduced-motion: reduce) {
    #micBtn.listening { animation: none; }
  }

  /* ---- landscape layout ---- */
  #app.layout-landscape {
    flex-direction: row;
    gap: 4vw;
  }
  #app.layout-landscape #controls {
    width: auto;
    max-width: 46vw;
  }
  #app.layout-landscape #sliderWrap {
    width: min(38vw, 420px);
  }
  #app.layout-landscape #circleWrap {
    width: min(62vh, 44vw);
    height: min(62vh, 44vw);
  }
  #app.layout-landscape.minimal #circleWrap {
    width: min(84vh, 52vw);
    height: min(84vh, 52vw);
  }

  /* ---- orientation fallback toggle (only shown if auto-detection is unavailable) ---- */
  #orientationToggleBtn {
    position: fixed;
    top: max(1.2vh, env(safe-area-inset-top));
    left: max(1.2vh, env(safe-area-inset-left));
    width: clamp(36px, 6vh, 46px);
    height: clamp(36px, 6vh, 46px);
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.1);
    color: var(--text);
    font-size: clamp(1rem, 2.4vh, 1.3rem);
    cursor: pointer;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>
<div id="app">

  <div id="circleWrap">
    <div id="circleBase"></div>
    <div id="circleFill"></div>
    <div id="ringOutline"></div>
    <div id="centerLabel">
      <div id="timeDisplay">05:00</div>
      <div id="statusLabel">Ready</div>
    </div>
  </div>

  <div id="controls">
    <div class="row" id="timeRow">
      <div id="sliderWrap">
        <div id="sliderLabel">5 min</div>
        <input type="range" id="timeSlider" min="0" max="8" step="1" value="4" aria-label="Timer duration in minutes">
        <div id="sliderTicks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>10</span><span>15</span><span>20</span><span>30</span></div>
      </div>
    </div>

    <div class="row primary-row">
      <button class="btn-round" id="resetBtn" title="Reset" aria-label="Reset">&#8634;</button>
      <button class="btn-round" id="startPauseBtn" title="Start" aria-label="Start">&#9654;</button>
      <button class="btn-round" id="micBtn" title="Toggle voice control" aria-label="Turn on voice control">&#127908;</button>
    </div>

    <div class="row" id="colorNumbersRow">
      <div id="customColorWrap" title="Choose color" aria-label="Choose color">
        <input type="color" id="customColorInput" value="#ff6f5e" list="colorPresets">
      </div>
      <datalist id="colorPresets">
        <option value="#ff6f5e"></option>
        <option value="#ffb703"></option>
        <option value="#4fd1a5"></option>
        <option value="#4c9aff"></option>
        <option value="#9b6bff"></option>
        <option value="#ff6bb0"></option>
      </datalist>
      <button class="chip" id="numbersToggleBtn"><span class="dot"></span><span id="numbersToggleLabel">Numbers: On</span></button>
    </div>

    <div id="voiceFeedback">Tap the mic once to turn on voice control, then just speak — "set timer for 10 minutes", "start", "hide numbers", "change color to blue"</div>
  </div>

  <div id="wakeHint"></div>
  <button id="orientationToggleBtn" title="Toggle layout orientation" aria-label="Switch to landscape layout">&#8646;</button>
</div>

<script>
(function() {
  const circleFill = document.getElementById('circleFill');
  const timeDisplay = document.getElementById('timeDisplay');
  const statusLabel = document.getElementById('statusLabel');
  const startPauseBtn = document.getElementById('startPauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const micBtn = document.getElementById('micBtn');
  const voiceFeedback = document.getElementById('voiceFeedback');
  const timeSlider = document.getElementById('timeSlider');
  const sliderLabel = document.getElementById('sliderLabel');
  const wakeHint = document.getElementById('wakeHint');
  const customColorInput = document.getElementById('customColorInput');
  const numbersToggleBtn = document.getElementById('numbersToggleBtn');
  const numbersToggleLabel = document.getElementById('numbersToggleLabel');
  const centerLabel = document.getElementById('centerLabel');
  const circleBase = document.getElementById('circleBase');

  const TIME_OPTIONS = [1, 2, 3, 4, 5, 10, 15, 20, 30];

  const appRoot = document.getElementById('app');
  let totalSeconds = 5 * 60;
  let remainingSeconds = totalSeconds;
  let running = false;
  let tickHandle = null;
  let lastTick = null;
  let numbersVisible = true;
  let hasStarted = false;

  function requestFS() {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (req) {
      try {
        const result = req.call(el);
        if (result && result.catch) result.catch(() => {});
      } catch (e) { /* requires a user gesture; ignore if unavailable */ }
    }
  }
  function exitFS() {
    if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
      if (exit) {
        try {
          const result = exit.call(document);
          if (result && result.catch) result.catch(() => {});
        } catch (e) {}
      }
    }
  }

  function enterMinimal() {
    hasStarted = true;
    appRoot.classList.add('minimal');
    requestFS();
  }
  function exitMinimal() {
    hasStarted = false;
    appRoot.classList.remove('minimal');
    exitFS();
  }

  const NAMED_COLORS = {
    red: '#ff5a4e', orange: '#ff8c42', amber: '#ffb703', yellow: '#ffd60a',
    green: '#4fd1a5', teal: '#2dd4bf', blue: '#4c9aff', purple: '#9b6bff',
    indigo: '#7c6bff', pink: '#ff6bb0', coral: '#ff6f5e', white: '#f4f2ff'
  };

  function setFillColor(hex) {
    document.documentElement.style.setProperty('--fill', hex);
    customColorInput.value = hex;
  }

  function setNumbersVisible(visible) {
    numbersVisible = visible;
    centerLabel.classList.toggle('numbers-off', !visible);
    numbersToggleBtn.classList.toggle('off', !visible);
    numbersToggleLabel.textContent = 'Numbers: ' + (visible ? 'On' : 'Off');
  }

  function formatTime(s) {
    s = Math.max(0, Math.round(s));
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  }

  function render() {
    timeDisplay.textContent = formatTime(remainingSeconds);
    const pct = totalSeconds > 0 ? Math.min(1, (totalSeconds - remainingSeconds) / totalSeconds) : 0;
    const deg = pct * 360;
    circleFill.style.background =
      `conic-gradient(from 0deg, #ffffff 0deg, #ffffff ${deg}deg, transparent ${deg}deg, transparent 360deg)`;

    if (remainingSeconds <= 0) {
      statusLabel.textContent = 'Time\'s up';
    } else if (running) {
      statusLabel.textContent = 'Running';
    } else if (remainingSeconds < totalSeconds) {
      statusLabel.textContent = 'Paused';
    } else {
      statusLabel.textContent = 'Ready';
    }

    startPauseBtn.innerHTML = running ? '&#10074;&#10074;' : '&#9654;';
    startPauseBtn.classList.toggle('running', running);
    startPauseBtn.setAttribute('aria-label', running ? 'Pause' : 'Start');
  }

  function tick(ts) {
    if (!running) return;
    if (lastTick == null) lastTick = ts;
    const dt = (ts - lastTick) / 1000;
    lastTick = ts;
    remainingSeconds -= dt;
    if (remainingSeconds <= 0) {
      remainingSeconds = 0;
      running = false;
      render();
      onFinish();
      return;
    }
    render();
    tickHandle = requestAnimationFrame(tick);
  }

  function start() {
    if (remainingSeconds <= 0) return;
    if (running) return;
    running = true;
    lastTick = null;
    enterMinimal();
    render();
    tickHandle = requestAnimationFrame(tick);
    requestWakeLock();
  }

  function pause() {
    running = false;
    if (tickHandle) cancelAnimationFrame(tickHandle);
    render();
  }

  function toggleStartPause() {
    if (running) pause(); else start();
  }

  function reset() {
    pause();
    remainingSeconds = totalSeconds;
    exitMinimal();
    render();
  }

  function syncSliderToDuration() {
    const currentMinutes = totalSeconds / 60;
    let idx = 0, bestDiff = Infinity;
    TIME_OPTIONS.forEach((m, i) => {
      const diff = Math.abs(m - currentMinutes);
      if (diff < bestDiff) { bestDiff = diff; idx = i; }
    });
    timeSlider.value = idx;
    sliderLabel.textContent = TIME_OPTIONS[idx] + ' min';
  }

  function setDuration(minutes) {
    pause();
    totalSeconds = Math.max(1, Math.round(minutes * 60));
    remainingSeconds = totalSeconds;
    syncSliderToDuration();
    render();
  }

  let dingCtx = null;
  function onFinish() {
    statusLabel.textContent = "Time's up";
    try {
      dingCtx = dingCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = dingCtx.currentTime;
      [880, 1108, 1318].forEach((freq, i) => {
        const osc = dingCtx.createOscillator();
        const gain = dingCtx.createGain();
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.0001, now + i * 0.35);
        gain.gain.exponentialRampToValueAtTime(0.3, now + i * 0.35 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.35 + 0.6);
        osc.connect(gain).connect(dingCtx.destination);
        osc.start(now + i * 0.35);
        osc.stop(now + i * 0.35 + 0.65);
      });
    } catch (e) { /* audio not available */ }
    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
  }

  // ---- controls wiring ----
  timeSlider.addEventListener('input', () => {
    const idx = Number(timeSlider.value);
    const minutes = TIME_OPTIONS[idx];
    sliderLabel.textContent = minutes + ' min';
    setDuration(minutes);
  });

  startPauseBtn.addEventListener('click', toggleStartPause);
  resetBtn.addEventListener('click', reset);

  customColorInput.addEventListener('input', (e) => setFillColor(e.target.value));

  numbersToggleBtn.addEventListener('click', () => setNumbersVisible(!numbersVisible));

  // ---- wake lock (keep screen on while mounted) ----
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeHint.textContent = '';
      }
    } catch (e) {
      wakeHint.textContent = 'Screen may sleep — disable auto-lock in tablet settings';
    }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && running) requestWakeLock();
  });

  // ---- voice control ----
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;

  function parseAndRun(transcript) {
    const t = transcript.toLowerCase().trim();
    voiceFeedback.textContent = 'Heard: "' + transcript + '"';

    // set timer for X minutes/seconds
    const setMatch = t.match(/(?:set|start)[^\d]*?(\d+(?:\.\d+)?)\s*(hour|hr|minute|min|second|sec)/);
    if (setMatch) {
      let value = parseFloat(setMatch[1]);
      const unit = setMatch[2];
      let minutes;
      if (unit.startsWith('hour') || unit.startsWith('hr')) minutes = value * 60;
      else if (unit.startsWith('min')) minutes = value;
      else minutes = value / 60;
      setDuration(minutes);
      if (t.includes('start') || t.includes('go')) start();
      voiceFeedback.textContent = `Set to ${formatTime(totalSeconds)}${(t.includes('start') || t.includes('go')) ? ' and started' : ''}`;
      return;
    }

    // add X minutes
    const addMatch = t.match(/add\s*(\d+(?:\.\d+)?)\s*(minute|min|second|sec)/);
    if (addMatch) {
      const value = parseFloat(addMatch[1]);
      const unit = addMatch[2];
      const addSeconds = unit.startsWith('min') ? value * 60 : value;
      totalSeconds += addSeconds;
      remainingSeconds += addSeconds;
      render();
      voiceFeedback.textContent = `Added ${addMatch[1]} ${unit}`;
      return;
    }

    if (/\b(pause|stop|halt)\b/.test(t)) {
      pause();
      voiceFeedback.textContent = 'Paused';
      return;
    }
    if (/\b(start|resume|go|begin)\b/.test(t)) {
      start();
      voiceFeedback.textContent = 'Started';
      return;
    }
    if (/\b(reset|restart|clear)\b/.test(t)) {
      reset();
      voiceFeedback.textContent = 'Reset';
      return;
    }

    if (/\b(hide|turn off|numbers off)\b.*\bnumbers?\b|\bnumbers?\b.*\boff\b/.test(t)) {
      setNumbersVisible(false);
      voiceFeedback.textContent = 'Numbers hidden';
      return;
    }
    if (/\b(show|turn on|numbers on)\b.*\bnumbers?\b|\bnumbers?\b.*\bon\b/.test(t)) {
      setNumbersVisible(true);
      voiceFeedback.textContent = 'Numbers shown';
      return;
    }

    const colorMatch = t.match(/\bcolor\s*(?:to)?\s*([a-z]+)\b/);
    if (colorMatch && NAMED_COLORS[colorMatch[1]]) {
      setFillColor(NAMED_COLORS[colorMatch[1]]);
      voiceFeedback.textContent = 'Color set to ' + colorMatch[1];
      return;
    }

    voiceFeedback.textContent = `Didn't catch a command in: "${transcript}"`;
  }

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    let alwaysListening = false;
    let restartTimer = null;

    let feedbackHideTimer = null;
    function showFeedback() {
      voiceFeedback.classList.add('active');
      if (feedbackHideTimer) clearTimeout(feedbackHideTimer);
    }
    function scheduleHideFeedback() {
      if (feedbackHideTimer) clearTimeout(feedbackHideTimer);
      feedbackHideTimer = setTimeout(() => voiceFeedback.classList.remove('active'), 3000);
    }

    recognition.onstart = () => {
      listening = true;
      micBtn.classList.add('listening');
    };
    recognition.onresult = (event) => {
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) {
          parseAndRun(event.results[i][0].transcript);
        }
      }
      showFeedback();
    };
    recognition.onerror = (event) => {
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        alwaysListening = false;
        voiceFeedback.textContent = 'Mic blocked — check the address bar and allow Microphone for this page';
        showFeedback();
      } else if (event.error === 'network') {
        voiceFeedback.textContent = 'Voice network error — check WiFi connection';
        showFeedback();
      }
      // no-speech / aborted are routine in always-on mode; onend handles the restart silently
    };
    recognition.onend = () => {
      listening = false;
      micBtn.classList.remove('listening');
      scheduleHideFeedback();
      if (alwaysListening) {
        if (restartTimer) clearTimeout(restartTimer);
        restartTimer = setTimeout(() => {
          try { recognition.start(); } catch (e) { /* already running */ }
        }, 300);
      }
    };

    micBtn.addEventListener('click', () => {
      if (alwaysListening) {
        alwaysListening = false;
        if (restartTimer) clearTimeout(restartTimer);
        micBtn.classList.remove('always-on');
        micBtn.setAttribute('aria-label', 'Turn on voice control');
        voiceFeedback.textContent = 'Voice control off';
        showFeedback();
        scheduleHideFeedback();
        try { recognition.stop(); } catch (e) {}
      } else {
        alwaysListening = true;
        micBtn.classList.add('always-on');
        micBtn.setAttribute('aria-label', 'Turn off voice control');
        voiceFeedback.textContent = 'Voice control on — just speak your command anytime';
        showFeedback();
        scheduleHideFeedback();
        try { recognition.start(); } catch (e) {}
      }
    });
  } else {
    micBtn.disabled = true;
    micBtn.style.opacity = '0.35';
    voiceFeedback.textContent = 'Voice control needs Chrome. Use the buttons above instead.';
  }

  const orientationToggleBtn = document.getElementById('orientationToggleBtn');

  const orientationMQ = window.matchMedia ? window.matchMedia('(orientation: landscape)') : null;
  let manualOrientation = null; // null = auto (from matchMedia); 'landscape' | 'portrait' = forced

  function applyLayout() {
    let isLandscape;
    if (manualOrientation) {
      isLandscape = manualOrientation === 'landscape';
    } else if (orientationMQ) {
      isLandscape = orientationMQ.matches;
    } else {
      isLandscape = window.innerWidth > window.innerHeight;
    }
    appRoot.classList.toggle('layout-landscape', isLandscape);
  }

  if (orientationMQ) {
    // Browser can detect orientation — switch automatically, no manual toggle needed.
    orientationMQ.addEventListener('change', () => { if (!manualOrientation) applyLayout(); });
  } else {
    // No orientation detection available — show a manual fallback toggle.
    orientationToggleBtn.style.display = 'flex';
    manualOrientation = window.innerWidth > window.innerHeight ? 'landscape' : 'portrait';
    orientationToggleBtn.addEventListener('click', () => {
      manualOrientation = manualOrientation === 'landscape' ? 'portrait' : 'landscape';
      orientationToggleBtn.setAttribute('aria-label', manualOrientation === 'landscape' ? 'Switch to portrait layout' : 'Switch to landscape layout');
      applyLayout();
    });
  }
  window.addEventListener('resize', () => { if (!orientationMQ) applyLayout(); });
  applyLayout();

  setFillColor('#ff6f5e');
  setNumbersVisible(true);
  syncSliderToDuration();
  render();
})();
</script>
</body>
</html>
